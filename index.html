<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeuroLeap - Cognitive App</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFC93C',
                        honey: '#F4B400',
                        orange: '#FF9F1C',
                        beeblack: '#2B2B2B',
                        cream: '#FFF8E8',
                        leaf: '#76C893',
                        sky: '#5BC0EB',
                        softred: '#FF6B6B',
                        bg: '#FFFDF6'
                    },
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                        display: ['Nunito', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(244, 180, 0, 0.15), 0 8px 10px -6px rgba(244, 180, 0, 0.1)',
                        'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)',
                    }
                }
            }
        }
    </script>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDBlKfgUJttw6uxIOGr9X30mg5LchEDUGU",
            authDomain: "neuroleap-290e3.firebaseapp.com",
            databaseURL: "https://neuroleap-290e3-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "neuroleap-290e3",
            storageBucket: "neuroleap-290e3.firebasestorage.app",
            messagingSenderId: "308483033370",
            appId: "1:308483033370:web:82ae484f81cbb1de00c4a3"
        };

        const app = initializeApp(firebaseConfig);
        window.firebaseAuth = getAuth(app);
        window.firebaseDb = getFirestore(app);
        console.log("Firebase initialized for NeuroLeap!");
    </script>

    <style>
        body {
            background-color: #FFFDF6;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-subtle {
            animation: bounce-subtle 2s infinite;
        }

        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            40% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Particle/Confetti Effects */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #FFF8E8; }
        ::-webkit-scrollbar-thumb { background: #F4B400; border-radius: 10px; }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 201, 60, 0.3);
        }

        .premium-btn {
            background: linear-gradient(135deg, #FFC93C 0%, #FF9F1C 100%);
            box-shadow: 0 4px 15px rgba(255, 159, 28, 0.3), inset 0 -3px 0 rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }
        .premium-btn:active {
            transform: scale(0.95);
            box-shadow: 0 1px 5px rgba(255, 159, 28, 0.3), inset 0 -1px 0 rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="text-beeblack">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS (SVG) ---
        const IconHome = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>;
        const IconGamepad = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"></path></svg>;
        const IconTrophy = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>;
        const IconStar = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>;
        const IconUser = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>;

        // Logo Baharu: Menggunakan gambar logo NeuroLeap yang dimuat naik
        const LogoNeuroLeap = ({ className = "w-20 h-20" }) => (
            <img src="https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=2,background=black,quality=75,width=1000,height=1000/content/tov/3e721d23-28c9-4673-8a39-0d29ae5534e6.png" alt="Logo NeuroLeap" className={className} />
        );

        // --- COMPONENTS ---

        // 1. Splash / Login Screen
        const LoginScreen = ({ onLogin }) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-bg p-6 relative overflow-hidden">
                    {/* Background decorations */}
                    <div className="absolute top-10 left-10 w-24 h-24 bg-primary rounded-full mix-blend-multiply filter blur-xl opacity-50 animate-float"></div>
                    <div className="absolute bottom-20 right-10 w-32 h-32 bg-leaf rounded-full mix-blend-multiply filter blur-xl opacity-30 animate-bounce-subtle"></div>
                    
                    <div className="z-10 flex flex-col items-center w-full max-w-md">
                        <div className="animate-float mb-6">
                            <LogoNeuroLeap className="w-40 h-40" /> {/* Ganti lebah dengan Logo IMG */}
                        </div>
                        <h1 className="font-display font-black text-5xl text-orange mb-2 text-center drop-shadow-md">
                            NeuroLeap
                        </h1>
                        <p className="text-lg font-bold text-beeblack/60 mb-10 text-center">
                            Terokai Potensi Minda Anda!
                        </p>

                        <div className="w-full space-y-4">
                            <button onClick={onLogin} className="w-full flex items-center justify-center gap-3 bg-white py-4 px-6 rounded-2xl shadow-soft font-bold text-lg border-2 border-gray-100 active:scale-95 transition-transform">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-6 h-6" alt="Google"/>
                                Log Masuk Google
                            </button>
                            <button onClick={onLogin} className="w-full flex items-center justify-center gap-3 bg-beeblack text-white py-4 px-6 rounded-2xl shadow-soft font-bold text-lg active:scale-95 transition-transform">
                                <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.04 2.26-.74 3.58-.7 2.05.06 3.4.98 4.25 2.5-4.22 2.36-3.4 8.01.6 9.49-.9 2.09-2.2 4.14-3.51 5.09v-.21zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                                Log Masuk Apple
                            </button>
                            <button onClick={onLogin} className="w-full flex items-center justify-center gap-3 premium-btn text-white py-4 px-6 rounded-2xl font-bold text-lg mt-4">
                                Mula Bermain (Guest)
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Home Dashboard
        const HomeScreen = ({ onPlayGame }) => {
            return (
                <div className="pb-24 pt-6 px-5 max-w-md mx-auto">
                    {/* Top Stats Bar */}
                    <div className="flex justify-between items-center mb-6">
                        <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-orange/20">
                            <span className="text-xl">🔥</span>
                            <span className="font-bold text-orange">7 Hari</span>
                        </div>
                        <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-primary/20">
                            <span className="text-xl">🍯</span>
                            <span className="font-bold text-honey">1,240</span>
                        </div>
                        <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-full shadow-sm border border-sky/20">
                            <span className="text-xl">🧠</span>
                            <span className="font-bold text-sky">Lvl 12</span>
                        </div>
                    </div>

                    {/* Mascot Welcome Card */}
                    <div className="glass-card rounded-3xl p-5 mb-8 relative flex items-center gap-4 overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-primary/20 rounded-full -mr-10 -mt-10"></div>
                        <div className="w-20 h-20 bg-cream rounded-2xl flex items-center justify-center shrink-0 animate-float shadow-inner-soft">
                            <LogoNeuroLeap className="w-16 h-16" /> {/* Ganti lebah dengan Logo IMG */}
                        </div>
                        <div className="z-10">
                            <p className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-1">Maskot Lebah</p> {/* Ganti Mascot Neuro dengan Maskot Lebah */}
                            <h2 className="text-xl font-display font-black text-beeblack leading-tight">
                                "Hebat Ammar! Otak anda semakin kuat hari ini!"
                            </h2>
                        </div>
                    </div>

                    {/* Today's Mission */}
                    <h3 className="font-display font-black text-2xl mb-4 text-beeblack">Misi Hari Ini</h3>
                    <div className="bg-white rounded-3xl p-5 shadow-soft mb-8 border-b-4 border-gray-100">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex items-center gap-3">
                                <div className="w-12 h-12 bg-sky/20 rounded-xl flex items-center justify-center text-2xl">🧩</div>
                                <div>
                                    <h4 className="font-bold text-lg">Latihan Logik</h4>
                                    <p className="text-sm text-gray-500">Selesaikan 3 teka-teki</p>
                                </div>
                            </div>
                            <div className="text-sky font-bold bg-sky/10 px-3 py-1 rounded-lg">0/3</div>
                        </div>
                        
                        {/* Progress Bar */}
                        <div className="w-full bg-gray-100 rounded-full h-3 mb-4 overflow-hidden">
                            <div className="bg-sky h-3 rounded-full w-1/3"></div>
                        </div>

                        <button onClick={onPlayGame} className="w-full premium-btn text-white py-3 rounded-xl font-bold text-lg flex justify-center items-center gap-2">
                            Main Sekarang <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </button>
                    </div>

                    {/* Cognitive Modules Grid */}
                    <h3 className="font-display font-black text-2xl mb-4 text-beeblack">Kategori Latihan</h3>
                    <div className="grid grid-cols-2 gap-4">
                        <ModuleCard icon="🧠" title="Memori" color="bg-primary/20" textColor="text-orange" onClick={onPlayGame}/>
                        <ModuleCard icon="🎯" title="Fokus" color="bg-softred/20" textColor="text-softred" onClick={onPlayGame}/>
                        <ModuleCard icon="⚡" title="Kelajuan" color="bg-sky/20" textColor="text-sky" onClick={onPlayGame}/>
                        <ModuleCard icon="🧩" title="Penyelesaian" color="bg-leaf/20" textColor="text-leaf" onClick={onPlayGame}/>
                    </div>
                </div>
            );
        };

        const ModuleCard = ({ icon, title, color, textColor, onClick }) => (
            <div onClick={onClick} className="bg-white rounded-2xl p-4 shadow-sm border-b-4 border-gray-100 active:scale-95 transition-transform cursor-pointer flex flex-col items-center justify-center text-center gap-2">
                <div className={`w-14 h-14 ${color} rounded-2xl flex items-center justify-center text-3xl mb-1`}>
                    {icon}
                </div>
                <h4 className={`font-bold ${textColor}`}>{title}</h4>
            </div>
        );

        // 3. Game Screen (Memory Match Prototype)
        const GameScreen = ({ onBack }) => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [isWon, setIsWon] = useState(false);

            const emojis = ['🍯', '🌻', '🐞', '🍃']; // Emojis untuk padanan kad (Kekalkan untuk variasi tematik)

            useEffect(() => {
                // Initialize game
                const shuffled = [...emojis, ...emojis]
                    .sort(() => Math.random() - 0.5)
                    .map((emoji, idx) => ({ id: idx, emoji }));
                setCards(shuffled);
            }, []);

            const handleCardClick = (index) => {
                if (flipped.length === 2 || matched.includes(index) || flipped.includes(index)) return;
                
                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    const match = cards[newFlipped[0]].emoji === cards[newFlipped[1]].emoji;
                    if (match) {
                        setMatched([...matched, newFlipped[0], newFlipped[1]]);
                        setFlipped([]);
                        if (matched.length + 2 === cards.length) {
                            setTimeout(() => setIsWon(true), 500);
                        }
                    } else {
                        setTimeout(() => setFlipped([]), 1000);
                    }
                }
            };

            return (
                <div className="min-h-screen bg-bg p-5 max-w-md mx-auto flex flex-col">
                    <div className="flex items-center justify-between mb-8">
                        <button onClick={onBack} className="w-10 h-10 bg-white rounded-full shadow-sm flex items-center justify-center">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <h2 className="font-display font-black text-xl">Latihan Memori</h2>
                        <div className="w-10 h-10"></div>
                    </div>

                    {!isWon ? (
                        <div className="flex-1 flex flex-col items-center justify-center">
                            <p className="font-bold text-gray-500 mb-6">Padankan gambar yang sama!</p>
                            <div className="grid grid-cols-2 gap-4 w-full px-4">
                                {cards.map((card, idx) => {
                                    const isFlipped = flipped.includes(idx) || matched.includes(idx);
                                    return (
                                        <div 
                                            key={card.id} 
                                            onClick={() => handleCardClick(idx)}
                                            className={`aspect-square rounded-2xl flex items-center justify-center text-5xl cursor-pointer transition-all duration-300 shadow-soft ${isFlipped ? 'bg-white border-2 border-primary rotate-0' : 'bg-primary border-b-4 border-orange -rotate-2'}`}
                                            style={{ transformStyle: 'preserve-3d' }}
                                        >
                                            <span className={`transition-opacity duration-300 ${isFlipped ? 'opacity-100 animate-pop' : 'opacity-0'}`}>
                                                {card.emoji}
                                            </span>
                                            {!isFlipped && <span className="absolute text-white/50 text-3xl font-black">?</span>}
                                        </div>
                                    )
                                })}
                            </div>
                        </div>
                    ) : (
                        <div className="flex-1 flex flex-col items-center justify-center animate-pop text-center">
                            <div className="text-8xl mb-4">🏆</div>
                            <h2 className="font-display font-black text-3xl text-orange mb-2">Luar Biasa!</h2>
                            <p className="font-bold text-gray-600 mb-8">+50 Mata Minda 🧠</p>
                            <button onClick={onBack} className="premium-btn text-white py-4 px-8 rounded-2xl font-bold text-xl">
                                Kumpul Ganjaran
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // 4. Bottom Navigation
        const BottomNav = ({ current, setView }) => {
            const navItems = [
                { id: 'home', icon: <IconHome />, label: 'Utama' },
                { id: 'games', icon: <IconGamepad />, label: 'Main' },
                { id: 'leaderboard', icon: <IconTrophy />, label: 'Carta' },
                { id: 'rewards', icon: <IconStar />, label: 'Ganjaran' },
                { id: 'profile', icon: <IconUser />, label: 'Profil' }
            ];

            return (
                <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.05)] pb-safe z-50">
                    <div className="flex justify-around items-center h-20 max-w-md mx-auto px-2">
                        {navItems.map(item => {
                            const isActive = current === item.id;
                            return (
                                <button 
                                    key={item.id} 
                                    onClick={() => setView(item.id)}
                                    className={`flex flex-col items-center justify-center w-16 gap-1 transition-colors ${isActive ? 'text-orange' : 'text-gray-400'}`}
                                >
                                    <div className={`p-2 rounded-xl ${isActive ? 'bg-orange/10 animate-pop' : ''}`}>
                                        {item.icon}
                                    </div>
                                    <span className="text-[10px] font-bold">{item.label}</span>
                                </button>
                            )
                        })}
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            const [view, setView] = useState('login'); // login, home, game
            
            const handleLogin = () => setView('home');
            const handlePlayGame = () => setView('game');
            const handleBackHome = () => setView('home');

            return (
                <div className="font-sans min-h-screen bg-bg">
                    {view === 'login' && <LoginScreen onLogin={handleLogin} />}
                    
                    {view === 'home' && (
                        <>
                            <HomeScreen onPlayGame={handlePlayGame} />
                            <BottomNav current="home" setView={setView} />
                        </>
                    )}

                    {view === 'game' && <GameScreen onBack={handleBackHome} />}

                    {/* Placeholder for other bottom nav views */}
                    {['games', 'leaderboard', 'rewards', 'profile'].includes(view) && (
                        <>
                            <div className="flex flex-col items-center justify-center min-h-[80vh]">
                                <span className="text-6xl mb-4">🚧</span>
                                <h2 className="font-display font-black text-2xl text-gray-400">Akan Datang!</h2>
                                <p className="font-bold text-gray-500">Modul sedang dibina oleh Neuro.</p>
                            </div>
                            <BottomNav current={view} setView={setView} />
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
