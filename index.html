<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NeuroLeap</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">Neuro<span>Leap</span></div>
        <p>Aplikasi Pembelajaran Kognitif Kanak-Kanak</p>
    </header>

    <main class="container">

        <section id="homeScreen" class="card">
            <div class="bee">🐝</div>

            <h1>Selamat Datang ke NeuroLeap!</h1>

            <p>
                Jawab lima soalan mudah dan kumpulkan markah.
            </p>

            <button id="startButton">
                Mula Bermain
            </button>
        </section>

        <section id="quizScreen" class="card hidden">

            <div class="quiz-top">
                <p id="progressText">Soalan 1 daripada 5</p>
                <p>Markah: <span id="scoreText">0</span></p>
            </div>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <h2 id="questionText">
                Soalan akan dipaparkan di sini
            </h2>

            <div id="answerContainer" class="answers"></div>

            <p id="feedbackText"></p>

            <button id="nextButton" class="hidden">
                Soalan Seterusnya
            </button>

        </section>

        <section id="resultScreen" class="card hidden">

            <div class="trophy">🏆</div>

            <h2>Tahniah!</h2>

            <p>Markah anda ialah:</p>

            <div id="finalScore" class="final-score">0/5</div>

            <p id="resultMessage"></p>

            <button id="restartButton">
                Main Semula
            </button>

        </section>

    </main>

    <footer>
        <p>© 2026 NeuroLeap</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
